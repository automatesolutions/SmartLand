<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Check a land price per sqm, growth score, and investment grade for any location in the Philippines." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>SmartLand</title>
    <script>
      // Apply a saved dark choice before first paint so there is no flash
      try {
        if (localStorage.getItem('smartland:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
